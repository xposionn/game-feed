[package]
name = "game-feed"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Passive, read-only game traffic decoder that streams decoded messages over a loopback WebSocket"

[dependencies]
aes = "0.8"
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
